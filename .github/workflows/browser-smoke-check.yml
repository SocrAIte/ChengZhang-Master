name: Browser Smoke Check

on:
  workflow_dispatch:

jobs:
  browser-smoke-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run dashboard browser smoke check
        run: python -m market_impact_radar pre-release-check --with-browser

      - name: Verify daily report preview files
        run: |
          test -f reports/daily/pre-release-check/index.html
          test -f reports/daily/pre-release-check/index.json
          test -f reports/daily/pre-release-check/2026-05-15/dashboard.html
          test -f reports/daily/pre-release-check/2026-05-15/dashboard_data.json
          test -f reports/daily/pre-release-check/2026-05-15/run_summary.json
          test -f reports/daily/pre-release-check/2026-05-15/knowledge_review.html
          test -f reports/daily/pre-release-check/2026-05-15/run_diagnostics.html

      - name: Upload browser smoke daily report preview
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-daily-report-preview
          path: reports/daily/pre-release-check/
          if-no-files-found: error
