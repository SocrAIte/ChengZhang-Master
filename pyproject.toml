[project]
name = "market-impact-radar"
version = "0.1.0"
description = "Cross-market signal to China A-share candidate radar"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["market_impact_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
